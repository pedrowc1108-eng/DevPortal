<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-cyan-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="logo-green-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="logo-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Fundo com efeito de vidro escuro e borda em degradê -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="url(#logo-cyan-purple)" stroke-width="2.5"/>
  <!-- Detalhes de iluminação nos cantos -->
  <circle cx="14" cy="14" r="2.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="50" cy="50" r="2.5" fill="#c084fc" opacity="0.8"/>
  <!-- Parênteses/Tags de Código estilizados -->
  <path d="M22 20L13 32L22 44" stroke="url(#logo-cyan-purple)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M42 20L51 32L42 44" stroke="url(#logo-green-cyan)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Barra Slash central -->
  <path d="M36 17L28 47" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
  <!-- Núcleo luminoso pulsante -->
  <circle cx="32" cy="32" r="4.5" fill="url(#logo-cyan-purple)" filter="url(#logo-glow-filter)"/>
</svg>

